name: Build iOS Tweak

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive # <--- DÒNG QUAN TRỌNG NHẤT: Kéo IMGUI về

      - name: Install Theos (Bản thủ công)
        run: |
          git clone --recursive https://github.com/theos/theos.git $HOME/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV
          echo "$HOME/theos/bin" >> $GITHUB_PATH
          
      - name: Build with Make
        run: |
          export THEOS=$HOME/theos
          export PATH=$THEOS/bin:$PATH
          # Xóa cache obj cũ để build sạch từ đầu
          rm -rf .theos
          make clean package

      - name: Upload .dylib
        uses: actions/upload-artifact@v4
        with:
          name: ZingTweak-dylib
          # .theos/obj/debug/ hay .theos/obj/ tùy thuộc vào DEBUG = 1 hay 0
          path: .theos/obj/*.dylib 
